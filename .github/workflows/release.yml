# Pushing a tag vX.Y.Z releases version X.Y.Z of the app, attached to a GitHub Release:
#   vi-translator-android-X.Y.Z.apk   signed APK, installed directly (the app updates itself from these)
#   vi-translator-android-latest.apk  the same APK: .../releases/latest/download/vi-translator-android-latest.apk
#                                     always serves the newest one
#   vi-translator-android-X.Y.Z.aab   signed app bundle for Google Play, the "play" build: no self-update
#                                     (the key is Play's upload key)
#
# The tag must look like v1.2.3 and be newer than the latest release.
#
# Repository secrets (the same key must sign every release, or phones refuse the update):
#   ANDROID_KEYSTORE_B64       the release keystore (PKCS12 .p12), base64
#   ANDROID_KEYSTORE_PASSWORD  the keystore's password
#   ANDROID_KEY_ALIAS          the key's alias in it
#   ANDROID_KEY_PASSWORD       the key's password
name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Check the tag
        id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "::error::Tags must look like v1.2.3, minor and patch under 100 (got $GITHUB_REF_NAME)"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Must be newer than the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          CUR=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          CUR="${CUR#v}"
          echo "latest release: ${CUR:-none}, tag: $V"
          if [ -n "$CUR" ] && { [ "$CUR" = "$V" ] || [ "$(printf '%s\n%s\n' "$CUR" "$V" | sort -V | tail -n1)" != "$V" ]; }; then
            echo "::error::$V is not newer than the latest release $CUR"; exit 1
          fi

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: The shared core's commit
        id: core
        run: echo "ref=$(grep -v '^#' native/core.ref | grep -v '^$' | tail -n1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: vi-translator/vi-translator-desktop
          ref: ${{ steps.core.outputs.ref }}
          path: core-src

      - name: Rust for the shared core
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
          echo "VIT_CORE_DIR=$GITHUB_WORKSPACE/core-src" >> "$GITHUB_ENV"
          echo "core_sha=$(git -C core-src rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Tools for chiaki-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build protobuf-compiler python3-protobuf
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build the native libraries
        run: native/build.sh

      - name: The core's Kotlin bindings in the repository match its library
        run: |
          git diff --exit-code -- app/src/main/kotlin/app/vitranslator/core/ || {
            echo "::error::app/src/main/kotlin/app/vitranslator/core/vi_translator_ffi.kt differs from the core's at native/core.ref: commit the copied file"; exit 1; }

      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::secret ANDROID_KEYSTORE_B64 is not set"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testGithubDebugUnitTest assembleGithubRelease bundlePlayRelease -PrequireNative -Pversion="$VERSION"

      - name: Check the signature and name the files
        run: |
          APK=app/build/outputs/apk/github/release/app-github-release.apk
          [ -f "$APK" ] || { echo "::error::no signed APK (is the keystore right?)"; ls -R app/build/outputs; exit 1; }
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -n1)/apksigner verify --print-certs "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libchiaki-jni.so" || { echo "::error::the APK has no PS Remote Play library"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libvi_translator_ffi.so" || { echo "::error::the APK has no translation core"; exit 1; }
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libchiaki-jni.so" || { echo "::error::the APK has no 32-bit libraries"; exit 1; }
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libvi_translator_ffi.so" || { echo "::error::the APK has no 32-bit translation core"; exit 1; }
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          [ -f "$AAB" ] || { echo "::error::no app bundle"; ls -R app/build/outputs; exit 1; }
          jarsigner -verify "$AAB" | grep -q "^jar verified" || { echo "::error::the app bundle isn't signed"; exit 1; }
          unzip -l "$AAB" | grep -q "base/lib/arm64-v8a/libchiaki-jni.so" || { echo "::error::the app bundle has no PS Remote Play library"; exit 1; }
          mkdir -p out
          cp "$AAB" "out/vi-translator-android-$VERSION.aab"
          cp "$APK" "out/vi-translator-android-$VERSION.apk"
          cp "$APK" "out/vi-translator-android-latest.apk"
          rm -f "$ANDROID_KEYSTORE"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: vi-translator-android
          path: out/*
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "VI Translator for Android $V" --generate-notes --verify-tag
